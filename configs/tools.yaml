tools:
  rdkit:
    enabled: true

  python_exec:
    enabled: true
    timeout_seconds: 5
    allow_imports: false

  file_io:
    enabled: true

  plotting:
    enabled: true

  doc_writer:
    enabled: true

  latex_writer:
    enabled: true

  paper_writer:
    # ~5-page publication-style LaTeX paper for the ADC linker workflow. Only
    # runs when an ADC goal profile is active in state.
    enabled: true

  memory_writer:
    enabled: true
    jsonl_path: "${PROJECT_MEMORY_JSONL:-data/memory/project_memory.jsonl}"
    markdown_path: "${PROJECT_MEMORY_MARKDOWN:-data/memory/project_memory.md}"
    max_markdown_entries: 200

  paper_review:
    enabled: true
    max_chars: 250000
    default_domain: chem_bio

  literature_tools:
    enabled: true
    backend: local
    allow_external_api: false
    supported_extensions: [.txt, .md]

  linker_design:
    enabled: true
    enabled_modes: [full, no_dft, cheap, offline]

  rag:
    enabled: true
    db_path: "${RAG_DB_PATH:-data/rag.sqlite}"
    supported_extensions: [.txt, .md, .markdown, .pdf, .docx]
    chunk_size: 700
    chunk_overlap: 100

  calculation_tools:
    enabled: true
    enabled_modes: [full, no_dft, cheap, offline]

  statistics_tools:
    enabled: true
    bootstrap_default_iterations: 1000
    enabled_modes: [full, no_dft, cheap, offline]

  robrains_bo:
    enabled: true
    repo_path: "${ROBRAINS_REPO_PATH:-/Users/es/GitHub/RoBrains}"
    backend: SingleBayesianOptiBackend
    enabled_modes: [full, no_dft, cheap, offline]

  xtb:
    enabled: true
    executable: xtb
    timeout_seconds: 120
    enabled_modes: [full, cheap, offline]

  dft_tools:
    enabled: true
    default_method: B3LYP
    default_basis: def2-SVP
    default_program: orca
    enabled_modes: [full, no_dft, cheap, offline]

  orca:
    enabled: true
    executable: orca
    timeout_seconds: 300
    enabled_modes: [full, offline]

  snellius_vllm:
    enabled: true
    container_path: /projects/2/managed_datasets/containers/vllm/vllm.sif
    fallback_container_path: /projects/2/managed_datasets/containers/vllm/cuda-13.0-vllm.sif
    partition: gpu_a100
    gpus_per_node: 1
    port: 8000
    allow_submit: false

  saturn:
    # Generative molecular design via schwallergroup/saturn.
    # Disabled by default: Saturn is a separate cloned repo with its own conda
    # env (Python 3.10, GPU recommended) and cannot be imported in-process.
    # When disabled or unconfigured, the tool returns a deterministic mock set.
    enabled: ${SATURN_ENABLED:-false}
    saturn_repo: ${SATURN_REPO:-}
    saturn_python: ${SATURN_PYTHON:-python}
    prior_checkpoint: ${SATURN_PRIOR:-}
    timeout_seconds: ${SATURN_TIMEOUT_SECONDS:-1800}
    allow_run: false
    # HPC (Snellius) remote submission. run_mode=slurm_remote stages the config
    # over SSH, submits with sbatch, waits, and downloads the SMILES logs. A real
    # submission requires allow_submit=true AND HPC_HOST/HPC_USER set; otherwise
    # the tool only writes the config + SLURM script (dry run) and returns mocks.
    run_mode: ${SATURN_RUN_MODE:-local}
    allow_submit: ${SATURN_ALLOW_SUBMIT:-false}
    partition: ${SLURM_PARTITION:-gpu_a100}
    gpus_per_node: ${SLURM_GPUS:-1}
    time_limit: ${SLURM_TIME:-02:00:00}
    poll_interval_seconds: ${HPC_POLL_INTERVAL:-30}
    remote_saturn_repo: ${SATURN_REMOTE_REPO:-}
    remote_saturn_python: ${SATURN_REMOTE_PYTHON:-python}
    remote_prior_checkpoint: ${SATURN_REMOTE_PRIOR:-}
    env_setup: ${SATURN_ENV_ACTIVATE:-}
    enabled_modes: [full, cheap]

  reinvent:
    # Generative molecular design via MolecularAI/REINVENT4.
    # Disabled by default: REINVENT4 is a heavy, GPU-oriented framework installed
    # into its own Python env (exposes a `reinvent` console script) and cannot be
    # imported in-process. When disabled or unconfigured, the tool returns a
    # deterministic mock set. Supports de novo sampling (also LibInvent /
    # LinkInvent / Mol2Mol via prior + input SMILES) and staged_learning (RL).
    enabled: ${REINVENT_ENABLED:-false}
    reinvent_executable: ${REINVENT_EXECUTABLE:-reinvent}
    reinvent_python: ${REINVENT_PYTHON:-python}
    prior_base: ${REINVENT_PRIOR_BASE:-}
    run_type: ${REINVENT_RUN_TYPE:-sampling}
    device: ${REINVENT_DEVICE:-cpu}
    timeout_seconds: ${REINVENT_TIMEOUT_SECONDS:-1800}
    allow_run: false
    # HPC (Snellius) remote submission. run_mode=slurm_remote stages the config
    # over SSH, submits with sbatch, waits, and downloads the SMILES CSVs. A real
    # submission requires allow_submit=true AND HPC_HOST/HPC_USER set; otherwise
    # the tool only writes the config + SLURM script (dry run) and returns mocks.
    run_mode: ${REINVENT_RUN_MODE:-local}
    allow_submit: ${REINVENT_ALLOW_SUBMIT:-false}
    # For CPU-only partitions (rome/genoa) set SLURM_PARTITION=rome and SLURM_GPUS=0;
    # gpus_per_node=0 omits the GPU directive so the job is accepted.
    partition: ${SLURM_PARTITION:-gpu_a100}
    gpus_per_node: ${SLURM_GPUS:-1}
    cpus_per_task: ${SLURM_CPUS_PER_TASK:-4}
    mem: ${SLURM_MEM:-32G}
    time_limit: ${SLURM_TIME:-02:00:00}
    poll_interval_seconds: ${HPC_POLL_INTERVAL:-30}
    remote_reinvent_executable: ${REINVENT_REMOTE_EXECUTABLE:-reinvent}
    remote_prior_base: ${REINVENT_REMOTE_PRIOR_BASE:-}
    env_setup: ${REINVENT_ENV_ACTIVATE:-}
    # Direct SSH to a rented GPU box (RunPod/Lambda/VM) — no scheduler. Set
    # REINVENT_RUN_MODE=ssh_remote and the REINVENT_SSH_* vars; reinvent runs as a
    # command over SSH and outputs are downloaded back. Reuses remote_reinvent_executable
    # and remote_prior_base for the pod's reinvent path and prior directory.
    ssh_host: ${REINVENT_SSH_HOST:-}
    ssh_user: ${REINVENT_SSH_USER:-root}
    ssh_port: ${REINVENT_SSH_PORT:-22}
    ssh_key_path: ${REINVENT_SSH_KEY:-}
    ssh_password: ${REINVENT_SSH_PASSWORD:-}
    remote_workdir: ${REINVENT_REMOTE_WORKDIR:-~/reinvent_runs}
    enabled_modes: [full, cheap]

  boltz_2:
    # Co-folding, structural docking, and binding affinity via Boltz-2.
    # Disabled by default: Boltz-2 is a heavy deep-learning model (GPU recommended).
    # When disabled, unconfigured, or when run=false, the tool uses a
    # high-fidelity deterministic mock co-folding simulation.
    enabled: ${BOLTZ_ENABLED:-false}
    boltz_executable: ${BOLTZ_EXECUTABLE:-boltz}
    run_mode: ${BOLTZ_RUN_MODE:-local}
    device: ${BOLTZ_DEVICE:-cpu}
    single_sequence: ${BOLTZ_SINGLE_SEQUENCE:-true}
    partition: ${SLURM_PARTITION:-gpu_a100}
    gpus_per_node: ${SLURM_GPUS:-1}
    time_limit: ${SLURM_TIME:-01:00:00}
    submit_command: ${SLURM_SUBMIT_COMMAND:-sbatch}
    # run_mode=slurm_remote stages inputs over SSH, submits, waits, and downloads
    # the predicted structures/metrics. Requires allow_submit=true AND
    # HPC_HOST/HPC_USER set; otherwise only the SLURM script is written (dry run).
    allow_submit: ${BOLTZ_ALLOW_SUBMIT:-false}
    allow_run: false
    poll_interval_seconds: ${HPC_POLL_INTERVAL:-30}
    env_setup: ${BOLTZ_ENV_ACTIVATE:-}
    timeout_seconds: ${BOLTZ_TIMEOUT_SECONDS:-1800}
    enabled_modes: [full, cheap]

  baybe:
    # Bayesian Design of Experiments via emdgroup/baybe (Merck KGaA).
    # Recommends the next most informative experiments (reaction conditions,
    # formulations, process parameters, library choices) in the low-/no-data
    # regime. Unlike Saturn (which generates molecules), BayBE selects optimal
    # configurations from a search space you define.
    #
    # BayBE is a normal pip package (`pip install 'baybe[chem,simulation]'`) and
    # imports in-process. Disabled by default and gated by allow_run: when off,
    # unconfigured, or run=false, the tool returns deterministic, space-filling
    # mock recommendations so the pipeline stays offline-safe.
    enabled: ${BAYBE_ENABLED:-false}
    allow_run: false
    enabled_modes: [full, no_dft, cheap]
