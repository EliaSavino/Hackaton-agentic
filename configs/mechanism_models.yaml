model_routing:
  default_alias: science_reasoning
  mechanism_reasoning_alias: science_reasoning
  mechanism_critic_alias: science_reasoning

models:
  science_reasoning:
    provider: anthropic
    model: anthropic/claude-sonnet-4-6
    capabilities: [reasoning, chemistry, science, mechanism, final_review, long_context, json, active_learning, experimental_design, computational_chemistry, literature, summarization, reporting, data_parsing, tool_use]
    api_key_env: ANTHROPIC_API_KEY
    cost_tier: high
    enabled: true

  frontier_reasoning:
    provider: anthropic
    model: anthropic/claude-sonnet-4-6
    capabilities: [reasoning, chemistry, science, mechanism, final_review, long_context, json, active_learning, experimental_design, computational_chemistry, literature, summarization, reporting, data_parsing, tool_use]
    api_key_env: ANTHROPIC_API_KEY
    cost_tier: high
    enabled: true

  local_large:
    provider: anthropic
    model: anthropic/claude-sonnet-4-6
    capabilities: [reasoning, chemistry, science, mechanism, final_review, long_context, json, active_learning, experimental_design, computational_chemistry, literature, summarization, reporting, data_parsing, tool_use]
    api_key_env: ANTHROPIC_API_KEY
    cost_tier: high
    enabled: true

  local_small:
    provider: anthropic
    model: anthropic/claude-sonnet-4-6
    capabilities: [reasoning, chemistry, science, mechanism, final_review, long_context, json, active_learning, experimental_design, computational_chemistry, literature, summarization, reporting, data_parsing, tool_use, fast, cheap]
    api_key_env: ANTHROPIC_API_KEY
    cost_tier: high
    enabled: true

  kinetic_first_order:
    provider: other
    model: deterministic-first-order
    capabilities: [numerics, kinetics]
    cost_tier: low
    enabled: true

  kinetic_deactivation:
    provider: other
    model: deterministic-deactivation
    capabilities: [numerics, kinetics]
    cost_tier: low
    enabled: true

  kinetic_product_inhibition:
    provider: other
    model: deterministic-product-inhibition
    capabilities: [numerics, kinetics]
    cost_tier: low
    enabled: true

  active_learning_heuristic:
    provider: other
    model: deterministic-disagreement-uncertainty-policy
    capabilities: [active_learning, experimental_design]
    cost_tier: low
    enabled: true

  snellius_vllm:
    provider: vllm
    model: "${SNELLIUS_VLLM_MODEL:-meta-llama/Llama-3.1-70B-Instruct}"
    capabilities: [reasoning, chemistry, science, mechanism, bulk, heavy, long_context, vllm, snellius]
    api_base_env: SNELLIUS_VLLM_BASE_URL
    api_key_env: SNELLIUS_VLLM_API_KEY
    cost_tier: low
    enabled: "${SNELLIUS_VLLM_ENABLED:-false}"
