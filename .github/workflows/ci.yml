name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLUMNS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q

      - name: Smoke CLI
        run: |
          hackathon-agents --help
          hackathon-agents mechanism-loop --help

      - name: Build wheel
        run: python -m build
